    {lab:["膝屈曲","Knee flexion","무릎 굴곡"],b:38,a:88},
    {lab:["腰部活动","Lumbar mobility","허리 가동성"],b:51,a:90}
  ]},
  market:{years:[2024,2025,2026,2027,2028,2029,2030], v:[8.1,9.8,11.9,14.4,17.4,21.0,25.3]}
};
/* ============ 基础工具 ============ */
function t(k){return T[k][L]}
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fmt(v){return v>=1000?(v/1000).toFixed(v%1000===0?0:1)+"K":String(v)}
/* ============ 语言与主题 ============ */
function ui(){
  document.title=t("meta_title")||"ReMotion AI · "+t("ht");
  document.documentElement.lang=["zh-CN","en","ko"][L];
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t)});
  var lg=$("lang");lg.innerHTML="";
  Ls.forEach(function(x,i){var b=document.createElement("button");b.textContent=x[1];b.className=i===L?"on":"";b.setAttribute("aria-pressed",i===L);
    b.onclick=function(){L=i;try{localStorage.setItem("lg",i)}catch(e){};ui()};lg.appendChild(b)});
  $("steps").innerHTML=T.steps.map(function(s){return '<div class="st"><span class="n">'+esc(s[0][L].slice(0,1))+"</span><b>"+esc(s[0][L])+"</b><p>"+esc(s[1][L])+"</p></div>"}).join("");
  $("agents").innerHTML=T.agents.map(function(a){return '<div class="ag"><b>'+esc(a[0][L])+"</b><small>"+esc(a[1][L])+"</small></div>"}).join("");
  $("dtxCards").innerHTML=T.dtxCards.map(function(c){return '<div class="card"><b style="color:var(--ac)">'+esc(c[0][L])+"</b><p class=\"mu\" style=\"margin-top:.3rem\">"+esc(c[1][L])+"</p></div>"}).join("");
  $("techCards").innerHTML=T.techCards.map(function(c){return '<div class="card"><b style="color:var(--ac)">'+esc(c[0][L])+"</b><p class=\"mu\" style=\"margin-top:.3rem\">"+esc(c[1][L])+"</p></div>"}).join("");
  $("road").innerHTML=T.road.map(function(r){return '<div class="rm"><em></em><b>'+esc(r[0][L])+"</b><p class=\"mu\">"+esc(r[1][L])+"</p></div>"}).join("");
  c1();c2();c3();tables();
}
$("th").onclick=function(){var r=document.documentElement,cur=r.getAttribute("data-theme")==="dark";
  r.setAttribute("data-theme",cur?"light":"dark");try{localStorage.setItem("th",cur?"light":"dark")}catch(e){}};
try{var sv=localStorage.getItem("lg");if(sv!==null)L=+sv;else{var n=(navigator.language||"").slice(0,2);L=n==="ko"?2:n==="en"?1:0}}catch(e){}
try{var th=localStorage.getItem("th");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}
/* ============ 图表 1：4 周依从率（双系列折线，强调式：品牌蓝 + 灰） ============ */
function c1(){
  var W=640,H=300,PL=46,PR=26,PT=16,PB=44,ipw=W-PL-PR,iph=H-PT-PB;
  var d=CD.adhere,n=d.rem.length;
  var x=i=>PL+ipw*i/(n-1), y=v=>PT+iph*(1-v/100);
  var s="";
  [0,25,50,75,100].forEach(function(g){var yy=y(g);
    s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--gr)" stroke-width="1"/>'+
       '<text x="'+(PL-8)+'" y="'+(yy+4)+'" font-size="11" fill="var(--ts)" text-anchor="end">'+g+"</text>"});
  d.rem.forEach(function(v,i){var xx=x(i),yy=y(v);
    if(i<n-1){s+='<line x1="'+xx+'" y1="'+yy+'" x2="'+x(i+1)+'" y2="'+y(d.rem[i+1])+'" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'}});
  d.con.forEach(function(v,i){var xx=x(i),yy=y(v);
    if(i<n-1){s+='<line x1="'+xx+'" y1="'+yy+'" x2="'+x(i+1)+'" y2="'+y(d.con[i+1])+'" stroke="var(--dem)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'}});
  d.rem.forEach(function(v,i){var xx=x(i),yy=y(v);
    s+='<circle cx="'+xx+'" cy="'+yy+'" r="5" fill="var(--s1)" stroke="var(--surf)" stroke-width="2"/>'+
       '<text x="'+xx+'" y="'+(yy-12)+'" font-size="12" fill="var(--tp)" text-anchor="middle">'+v+"%</text>"});
  d.con.forEach(function(v,i){var xx=x(i),yy=y(v);
    s+='<circle cx="'+xx+'" cy="'+yy+'" r="5" fill="var(--dem)" stroke="var(--surf)" stroke-width="2"/>'+
       '<text x="'+xx+'" y="'+(yy+20)+'" font-size="12" fill="var(--ts)" text-anchor="middle">'+v+"%</text>"});
  d.labels.forEach(function(lb,i){s+='<text x="'+x(i)+'" y="'+(H-14)+'" font-size="12" fill="var(--ts)" text-anchor="middle">'+esc(lb[L])+"</text>"});
  s+='<rect x="'+PL+'" y="'+PT+'" width="'+ipw+'" height="'+iph+'" fill="transparent" id="c1hit"/>';
  s+='<line id="c1x" y1="'+PT+'" y2="'+(PT+iph)+'" stroke="var(--ts)" stroke-width="1" opacity="0"/>';
  $("cw1").innerHTML='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(t("ch1t"))+'">'+s+"</svg>";
  var hit=$("c1hit");if(!hit)return;
  hit.addEventListener("pointermove",function(e){var r=this.getBoundingClientRect(),px=e.clientX-r.left;
    var i=Math.round((px-PL)/ipw*(n-1));i=Math.max(0,Math.min(n-1,i));
    var X=x(i),xx=r.left+X*(r.width/W),yy=r.top+(y(d.rem[i]))*(r.height/H);
    $("c1x").setAttribute("x1",X);$("c1x").setAttribute("x2",X);$("c1x").setAttribute("opacity",1);
    showTip("c1",i,xx,yy)});
  hit.addEventListener("pointerleave",function(){$("c1x").setAttribute("opacity",0);hideTip()});
  hit.addEventListener("focus",function(){try{hit.setAttribute("tabindex","0")}catch(e){}});
  var desc=t("ch1l1")+": "+d.rem.join(", ")+"; "+t("ch1l2")+": "+d.con.join(", ");
  hit.setAttribute("aria-label",desc);hit.setAttribute("tabindex","0");
}
/* ============ 图表 2：干预前后活动度（哑铃图，单色系两档） ============ */
function c2(){
  var W=640,H=280,PL=130,PR=26,PT=30,PB=50,ipw=W-PL-PR,iph=H-PT-PB;
  var d=CD.rom,x=v=>PL+ipw*v/100,rowH=iph/d.items.length;
  var s="";
  [0,25,50,75,100].forEach(function(g){var xx=x(g);
    s+='<line x1="'+xx+'" x2="'+xx+'" y1="'+PT+'" y2="'+(PT+iph)+'" stroke="var(--gr)" stroke-width="1"/>'+
       '<text x="'+xx+'" y="'+(H-16)+'" font-size="11" fill="var(--ts)" text-anchor="middle">'+g+"%</text>"});
  d.items.forEach(function(it,i){var cy=PT+rowH*i+rowH/2,xb=x(it.b),xa=x(it.a);
    s+='<line x1="'+xb+'" y1="'+cy+'" x2="'+xa+'" y2="'+cy+'" stroke="var(--ax)" stroke-width="2"/>';
    s+='<circle cx="'+xb+'" cy="'+cy+'" r="6" fill="var(--seqL)" stroke="var(--surf)" stroke-width="2" tabindex="0" data-tip="'+i+'-b"/>';
    s+='<circle cx="'+xa+'" cy="'+cy+'" r="6" fill="var(--s1)" stroke="var(--surf)" stroke-width="2" tabindex="0" data-tip="'+i+'-a"/>';
    s+='<circle cx="'+xb+'" cy="'+cy+'" r="14" fill="transparent" data-tip="'+i+'-b" class="c2hit"/>';
    s+='<circle cx="'+xa+'" cy="'+cy+'" r="14" fill="transparent" data-tip="'+i+'-a" class="c2hit"/>';
    s+='<text x="'+(xb-12)+'" y="'+(cy+4)+'" font-size="12" fill="var(--ts)" text-anchor="end">'+it.b+"%</text>";
    s+='<text x="'+(xa+12)+'" y="'+(cy+4)+'" font-size="12" fill="var(--tp)" text-anchor="start">'+it.a+"%</text>";
    s+='<text x="'+(PL-10)+'" y="'+(cy+4)+'" font-size="13" fill="var(--tp)" text-anchor="end">'+esc(it.lab[L])+"</text>"});
  $("cw2").innerHTML='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(t("ch2t"))+'">'+s+"</svg>";
  document.querySelectorAll("#cw2 .c2hit").forEach(function(h){
    h.addEventListener("pointerenter",function(e){var r=h.getBoundingClientRect();
      var key=h.getAttribute("data-tip"),i=+key[0],side=key[2]==="b"?d.items[i].b:d.items[i].a;
      showTipRaw(t("ch2l"+(side===d.items[i].b?1:2))+": "+side+"%",r.left+16,r.top-10)});
    h.addEventListener("pointerleave",hideTip);
    h.addEventListener("focus",function(e){var r=h.getBoundingClientRect(),key=h.getAttribute("data-tip");
      var i=+key[0],side=key[2]==="b"?d.items[i].b:d.items[i].a;
      showTipRaw(t("ch2l"+(side===d.items[i].b?1:2))+": "+side+"%",r.left+16,r.top-10)});
    h.addEventListener("blur",hideTip);
  });
  document.querySelectorAll('#cw2 [data-tip]:not(.c2hit)').forEach(function(c){
    var key=c.getAttribute("data-tip"),i=+key[0],side=key[2]==="b"?"b":"a";
    c.setAttribute("aria-label",esc(d.items[i].lab[L])+" "+(side==="b"?t("ch2l1"):t("ch2l2"))+": "+(side==="b"?d.items[i].b:d.items[i].a)+"%");
  });
}
/* ============ 图表 3：市场规模（单系列折线 + 面积） ============ */
function c3(){
  var W=640,H=300,PL=46,PR=26,PT=16,PB=44,ipw=W-PL-PR,iph=H-PT-PB;
  var d=CD.market,n=d.v.length,maxV=30;
  var x=i=>PL+ipw*i/(n-1), y=v=>PT+iph*(1-v/maxV);
  var s="";
  [0,5,10,15,20,25,30].forEach(function(g){var yy=y(g);
    s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--gr)" stroke-width="1"/>'+
       '<text x="'+(PL-8)+'" y="'+(yy+4)+'" font-size="11" fill="var(--ts)" text-anchor="end">$'+g+"B</text>"});
  var pts=d.v.map(function(v,i){return x(i)+","+y(v)}).join(" ");
  s+='<polygon points="'+x(0)+","+y(0)+" "+pts+" "+x(n-1)+","+y(0)+'" fill="var(--s1)" opacity="0.1"/>';
  s+='<polyline points="'+pts+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  d.v.forEach(function(v,i){s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="var(--s1)" stroke="var(--surf)" stroke-width="2"/>'});
  d.years.forEach(function(yr,i){s+='<text x="'+x(i)+'" y="'+(H-14)+'" font-size="12" fill="var(--ts)" text-anchor="middle">'+yr+"</text>"});
  s+='<circle cx="'+x(n-1)+'" cy="'+y(d.v[n-1])+'" r="5" fill="var(--s1)" stroke="var(--surf)" stroke-width="2"/>';
  s+='<text x="'+x(n-1)+'" y="'+(y(d.v[n-1])-12)+'" font-size="12" fill="var(--tp)" text-anchor="middle">$'+d.v[n-1]+"B</text>";
  s+='<rect x="'+PL+'" y="'+PT+'" width="'+ipw+'" height="'+iph+'" fill="transparent" id="c3hit"/>';
  s+='<line id="c3x" y1="'+PT+'" y2="'+(PT+iph)+'" stroke="var(--ts)" stroke-width="1" opacity="0"/>';
  $("cw3").innerHTML='<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(t("ch3t"))+'">'+s+"</svg>";
  var hit=$("c3hit");if(!hit)return;
  hit.setAttribute("tabindex","0");
  hit.setAttribute("aria-label",d.years.map(function(yy,i){return yy+": $"+d.v[i]+"B"}).join("; "));
  hit.addEventListener("pointermove",function(e){var r=this.getBoundingClientRect(),px=e.clientX-r.left;
    var i=Math.round((px-PL)/ipw*(n-1));i=Math.max(0,Math.min(n-1,i));
    var X=x(i),xx=r.left+X*(r.width/W),yy=r.top+(y(d.v[i]))*(r.height/H);
    $("c3x").setAttribute("x1",X);$("c3x").setAttribute("x2",X);$("c3x").setAttribute("opacity",1);
    showTip("c3",i,xx,yy)});
  hit.addEventListener("pointerleave",function(){$("c3x").setAttribute("opacity",0);hideTip()});
}
/* ============ 提示框（跨图共用） ============ */
function showTip(which,i,px,py){
  var d=which==="c1"?CD.adhere:CD.market,el=$("tip"),b=el.getBoundingClientRect();
  var lab=d.labels?d.labels[i][L]:d.years[i];
  var rows=which==="c1"?
    '<div class="row"><i style="background:var(--s1)"></i>'+esc(t("ch1l1"))+": <b>"+d.rem[i]+"%</b></div><div class=\"row\"><i style=\"background:var(--dem)\"></i>"+esc(t("ch1l2"))+": <b>"+d.con[i]+"%</b></div>"
    :'<b>$'+d.v[i]+"B</b>";
  el.innerHTML="<b>"+esc(lab)+"</b>"+rows;
  el.style.left=Math.min(px+14,window.innerWidth-el.offsetWidth-12)+"px";
  el.style.top=(py-el.offsetHeight-12)+"px";el.style.opacity=1;
}
function showTipRaw(html,px,py){var el=$("tip");el.innerHTML=html;el.style.left=px+"px";el.style.top=py+"px";el.style.opacity=1}
function hideTip(){$("tip").style.opacity=0;$("tip").setAttribute("aria-hidden","true")}
/* ============ 数据表（无障碍通道：不依赖悬停也能读值） ============ */
function tables(){
  var d=CD.adhere,$t=$("tb1"),h="<tr><th></th>"+d.labels.map(function(l){return "<th>"+esc(l[L])+"</th>"}).join("")+"</tr>";
  $t.innerHTML=h+"<tr><td>"+esc(t("ch1l1"))+"</td>"+d.rem.map(function(v){return "<td>"+v+"%</td>"}).join("")+"</tr>"+
    "<tr><td>"+esc(t("ch1l2"))+"</td>"+d.con.map(function(v){return "<td>"+v+"%</td>"}).join("")+"</tr>";
  $("tb2").innerHTML="<tr><th></th><th>"+esc(t("ch2l1"))+"</th><th>"+esc(t("ch2l2"))+"</th></tr>"+
    CD.rom.items.map(function(it){return "<tr><td>"+esc(it.lab[L])+"</td><td>"+it.b+"%</td><td>"+it.a+"%</td></tr>"}).join("");
  $("tb3").innerHTML="<tr>"+CD.market.years.map(function(y){return "<th>"+y+"</th>"}).join("")+"</tr><tr>"+
    CD.market.v.map(function(v){return "<td>$"+v+"B</td>"}).join("")+"</tr>";
}
/* ============ 滚动动效与导航 ============ */
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target)}})},{threshold:.12});
document.querySelectorAll(".rv").forEach(function(el){io.observe(el)});
window.addEventListener("scroll",function(){$("nav").classList.toggle("st",window.scrollY>8)},{passive:true});
ui();
</script>
